plugins {
    id 'com.android.application'
}

android {
    namespace 'de.nowplaying.tablet'
    compileSdk 34

    defaultConfig {
        applicationId 'de.nowplaying.tablet'
        minSdk 21
        // Deliberately low: simple permission model, runs fine on Android 7
        targetSdk 28
        versionCode 11
        versionName '1.10'
    }

    // Fixed key checked into the project so updates install without uninstalling first.
    // Intended for private use only: key and password are public, so the key
    // protects nothing (see README, section Security).
    signingConfigs {
        fixed {
            storeFile file('../keystore/nowplaying.jks')
            storePassword 'nowplaying'
            keyAlias 'nowplaying'
            keyPassword 'nowplaying'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

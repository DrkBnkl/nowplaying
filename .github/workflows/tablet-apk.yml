name: Tablet-APK bauen

on:
  push:
    paths:
      - "tablet-app/**"
      - ".github/workflows/tablet-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tablet-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: NowPlaying-APK
          path: tablet-app/app/build/outputs/apk/release/*.apk

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Now Playing</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #F2F2F2; overflow: hidden;
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none; }
  .view { display: none; position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  body.play  #play  { display: block; }
  body.off   #off   { display: block; }

  /* ---------- Cover links, Songinfos rechts, LED-Leiste unten ----------
     Zwei Ebenen (.slide): die neue wird vorbereitet und blendet ueber die alte. */
  #play { background: #0B0B0C; overflow: hidden; }
  .slide { position: absolute; left: 0; top: 0; right: 0; bottom: 0; opacity: 0;
    -webkit-transition: opacity 1.5s ease; transition: opacity 1.5s ease; }
  .slide.on { opacity: 1; }
  .slide.gone { visibility: hidden; }
  .bg { position: absolute; left: -10%; top: -10%; width: 120%; height: 120%;
    -webkit-filter: blur(40px) brightness(.5); filter: blur(40px) brightness(.5);
    -webkit-transform: translateZ(0); transform: translateZ(0); }
  .stage { position: relative; height: 100%; box-sizing: border-box; padding: 5vh 5vw 4.5vh;
    display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .top { -webkit-flex: 1; flex: 1; min-height: 0;
    display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .cover { width: 74vh; height: 74vh; -webkit-flex: none; flex: none; border-radius: 1.2vh;
    box-shadow: 0 0 0 1px rgba(255,255,255,.09), 0 3vh 8vh rgba(0,0,0,.6); background: #1a1a1a;
    -webkit-transition: opacity .6s; transition: opacity .6s; }
  .info { -webkit-flex: 1; flex: 1; min-width: 0; margin-left: 8vw; margin-right: 2vw;
    text-shadow: 0 .3vh 1.5vh rgba(0,0,0,.45); -webkit-transition: opacity .6s; transition: opacity .6s; }
  .info div { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical;
    word-wrap: break-word; overflow-wrap: break-word; }  /* lange Woerter umbrechen statt abschneiden */
  .artist { font-size: 7vh; font-weight: 500; line-height: 1.15; color: #F4F4F4; -webkit-line-clamp: 2; }
  .title  { font-size: 4.6vh; line-height: 1.25; color: #D6D6D6; margin-top: 2vh; -webkit-line-clamp: 3; }
  .meta   { font-size: 3.2vh; line-height: 1.3; color: #9C9C9C; margin-top: 1.6vh; -webkit-line-clamp: 2; }
  .specspace { height: 12vh; margin-top: 3.5vh; -webkit-flex: none; flex: none; }
  #spec { position: absolute; left: 5vw; right: 5vw; bottom: 4.5vh; width: 90vw; height: 12vh; display: block;
    -webkit-transform: translateZ(0); transform: translateZ(0); }  /* eigene Ebene ueber den Slides */
  body.paused .cover, body.paused .info { opacity: .5; }
  body.nospec #spec { visibility: hidden; }
  /* Mehr davon, Stopp und naechster Titel: rechts ueber der Leiste, nur wenn die Quelle das kann */
  .ctl { display: none; position: absolute; bottom: 22vh; width: 9vh; height: 9vh; border-radius: 50%;
    box-sizing: border-box; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07);
    color: rgba(255,255,255,.6); -webkit-transform: translateZ(0); transform: translateZ(0);
    -webkit-transition: opacity .2s; transition: opacity .2s; -webkit-tap-highlight-color: transparent; }
  .ctl svg { position: absolute; left: 27%; top: 27%; width: 46%; height: 46%; fill: currentColor; }
  .ctl.busy { opacity: .35; }
  #skip { right: 5vw; }
  #stop { right: 5vw; margin-right: 11.5vh; }
  #similar { right: 5vw; margin-right: 23vh; }
  body.canskip #skip, body.canstop #stop, body.cansimilar #similar { display: block; }
  .ctl.done { color: #fff; background: rgba(255,255,255,.22); }   /* kurz hell: eingefuegt */

  /* ---------- Keine Musik: schwarz, das Display geht aus ---------- */
  #off { background: #000; }
</style>
</head>
<body class="off">

<div id="play" class="view">
  <div class="slide gone"><canvas class="bg"></canvas><div class="stage"><div class="top">
    <canvas class="cover"></canvas>
    <div class="info"><div class="artist"></div><div class="title"></div><div class="meta"></div></div>
  </div><div class="specspace"></div></div></div>
  <div class="slide gone"><canvas class="bg"></canvas><div class="stage"><div class="top">
    <canvas class="cover"></canvas>
    <div class="info"><div class="artist"></div><div class="title"></div><div class="meta"></div></div>
  </div><div class="specspace"></div></div></div>
  <canvas id="spec"></canvas>
  <div id="similar" class="ctl"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
  <div id="stop" class="ctl"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></div>
  <div id="skip" class="ctl"><svg viewBox="0 0 24 24"><path d="M5 5v14l11-7zM17 5h2.6v14H17z"/></svg></div>
</div>

<div id="off" class="view"></div>

<script>
// Bewusst ES5 + XMLHttpRequest, damit es auch im alten Android-WebView (Yoga: Android 6) laeuft.
function el(id) { return document.getElementById(id); }
function get(url, cb) {
  var x = new XMLHttpRequest();
  x.open("GET", url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + new Date().getTime(), true);
  x.timeout = 6000;
  x.onload = function () { try { cb(JSON.parse(x.responseText)); } catch (e) {} };
  x.send();
}

/* ================= Cover-Farben ================= */
var pal = { low: "#3E8C9C", mid: "#E9A24F", high: "#F2E6D0" };
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), h = 0, s = 0, l = (mx + mn) / 2, d = mx - mn;
  if (d) {
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hsl(h, s, l) { return "hsl(" + Math.round(h) + "," + Math.round(s * 100) + "%," + Math.round(l * 100) + "%)"; }
function extractPalette(img) {
  try {
    var c = document.createElement("canvas"); c.width = c.height = 32;
    var x = c.getContext("2d"); x.drawImage(img, 0, 0, 32, 32);
    var d = x.getImageData(0, 0, 32, 32).data, bins = [], i, k, bright = [0, 0, 0], lum = 0;
    for (k = 0; k < 12; k++) bins.push({ w: 0, h: 0, s: 0, l: 0 });
    for (i = 0; i < d.length; i += 4) {
      var p = rgb2hsl(d[i], d[i + 1], d[i + 2]);
      lum += p[2];
      if (p[2] > bright[2]) bright = p;
      if (p[1] < .15 || p[2] < .12 || p[2] > .92) continue;
      var w = p[1] * (1 - Math.abs(p[2] - .5));
      var b = bins[Math.floor(p[0] / 30) % 12];
      b.w += w; b.h += p[0] * w; b.s += p[1] * w; b.l += p[2] * w;
    }
    var order = bins.map(function (b, idx) { return { b: b, i: idx }; })
      .filter(function (o) { return o.b.w > 0; })
      .sort(function (a, b) { return b.b.w - a.b.w; });
    lum = lum / (d.length / 4);   // nicht in pal schreiben: das ist noch die Palette des gezeigten Covers
    if (!order.length) {
      pal = { low: "#7A7A7A", mid: "#BDBDBD", high: "#F2F2F2", t1: "#F4F4F4", t2: "#CFCFCF", t3: "#9C9C9C", lum: lum };
      return;
    }
    function col(o, lMin) {
      var b = o.b; return [b.h / b.w, Math.max(.35, b.s / b.w), Math.max(lMin, Math.min(.75, b.l / b.w))];
    }
    var m = col(order[0], .5), lo = m;
    for (k = 1; k < order.length; k++) {
      var dist = Math.abs(order[k].i - order[0].i); dist = Math.min(dist, 12 - dist);
      if (dist >= 2) { lo = col(order[k], .42); break; }
    }
    if (lo === m) lo = [m[0], m[1] * .8, .42];
    var hi = bright[2] > .7 ? [bright[0], Math.min(bright[1], .5), Math.max(.82, bright[2])] : [m[0], .35, .86];
    // Textfarben: Grundton des Covers, hell genug fuer den dunklen Hintergrund
    pal = { low: hsl(lo[0], lo[1], lo[2]), mid: hsl(m[0], m[1], m[2]), high: hsl(hi[0], hi[1], hi[2]),
            t1: hsl(m[0], Math.min(m[1], .45), .9),
            t2: hsl(m[0], Math.max(.45, Math.min(m[1], .8)), .72),
            t3: hsl(m[0], .18, .64), lum: lum };
  } catch (e) {}
}

/* ================= Spektrum (LED-Leiste) ================= */
var N = 40, M = 10, lv = [], pk = [], tg = [], lastSpec = 0, lastSignal = 0, es = null, esUrl = "";
for (var z = 0; z < N; z++) { lv.push(0); pk.push(0); tg.push(0); }
function onSpectrum(arr) {
  var sum = 0;
  for (var i = 0; i < N; i++) {
    tg[i] = Math.min(1, (parseInt(arr[Math.floor(i * arr.length / N)], 10) || 0) / 1000);
    sum += tg[i];
  }
  lastSpec = new Date().getTime();
  if (sum > .2) lastSignal = lastSpec;
}
function connectSpectrum(url) {
  if (url === esUrl) return;
  if (es) { es.close(); es = null; }
  esUrl = url;
  if (!url || !window.EventSource) return;
  es = new EventSource(url);
  es.onmessage = function (e) { onSpectrum(e.data.split(";")); };
}
/* Sparsam fuer das alte Tablet: 30 Bilder/s (FRAME_MS), Zeichnen in CSS-Pixeln,
   die dunklen Zellen werden einmal vorgezeichnet, und es wird nur neu gezeichnet,
   wenn sich mindestens eine Zelle aendert. */
var cv = el("spec"), cx = cv.getContext("2d"), running = false, SCALE = 1, FRAME_MS = 33;  // 30 Bilder/s = Takt der Daten vom Pi
var grid = document.createElement("canvas"), gridKey = "", shown = [], geo = null;
var BANDS = [[0, 5, "low"], [5, 8, "mid"], [8, 10, "high"]];  // Zeilen [von, bis) -> Farbe
function cellY(r) { return geo.h - (r + 1) * geo.sh - r * geo.gy; }
function layout() {
  var w = Math.round(cv.clientWidth * SCALE), h = Math.round(cv.clientHeight * SCALE);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  var gx = w * .006, gy = h * .03;
  geo = { w: w, h: h, gx: gx, gy: gy, bw: (w - gx * (N - 1)) / N, sh: (h - gy * (M - 1)) / M };
  var key = w + "x" + h + pal.low + pal.mid + pal.high;
  if (key === gridKey) return false;
  gridKey = key; grid.width = w; grid.height = h;
  var g = grid.getContext("2d"), i, b, r;
  g.clearRect(0, 0, w, h); g.globalAlpha = .08;
  for (b = 0; b < BANDS.length; b++) {
    g.fillStyle = pal[BANDS[b][2]];
    for (i = 0; i < N; i++) for (r = BANDS[b][0]; r < BANDS[b][1]; r++)
      g.fillRect(i * (geo.bw + geo.gx), cellY(r), geo.bw, geo.sh);
  }
  return true;
}
function frame() {
  if (!running) return;
  setTimeout(frame, FRAME_MS);
  var now = new Date().getTime(), i, b, r;
  if (now - lastSpec > 1000) for (i = 0; i < N; i++) tg[i] = 0;
  var dirty = layout(), lit = [], peak = [];
  for (i = 0; i < N; i++) {
    lv[i] += (tg[i] - lv[i]) * (tg[i] > lv[i] ? .91 : .44);
    pk[i] = lv[i] >= pk[i] ? lv[i] : Math.max(lv[i], pk[i] - .024);
    lit[i] = Math.round(lv[i] * M);
    peak[i] = Math.max(lit[i], Math.round(pk[i] * M)) - 1;
    if (shown[i] !== lit[i] * 16 + peak[i]) { shown[i] = lit[i] * 16 + peak[i]; dirty = true; }
  }
  if (!dirty) return;
  cx.clearRect(0, 0, geo.w, geo.h);
  cx.drawImage(grid, 0, 0);
  for (b = 0; b < BANDS.length; b++) {
    cx.fillStyle = pal[BANDS[b][2]];
    for (i = 0; i < N; i++) for (r = BANDS[b][0]; r < Math.min(BANDS[b][1], lit[i]); r++)
      cx.fillRect(i * (geo.bw + geo.gx), cellY(r), geo.bw, geo.sh);
  }
  cx.fillStyle = pal.high;
  for (i = 0; i < N; i++) if (peak[i] >= lit[i] && peak[i] >= 0)
    cx.fillRect(i * (geo.bw + geo.gx), cellY(peak[i]), geo.bw, geo.sh);
}
function setRunning(on) { if (on && !running) { running = true; frame(); } else if (!on) running = false; }

/* In der Tablet-App zeichnet die App die Leiste selbst (eigene Zeichenflaeche, spart auf dem
   alten Tablet fast einen ganzen Prozessorkern). Die Seite meldet ihr nur, ob die Leiste
   erlaubt ist, die Adresse des Spektrum-Dienstes und die Farben des Covers. */
var APP = window.NowPlayingApp && window.NowPlayingApp.bar ? window.NowPlayingApp : null;
var appBar = { on: false, url: "", sent: "" };
function hex(c) { cx.fillStyle = c; return cx.fillStyle; }   // "hsl(...)" -> "#rrggbb"
function syncAppBar() {
  if (!APP) return;
  var a = [appBar.on, appBar.url, hex(pal.low), hex(pal.mid), hex(pal.high)], s = a.join("|");
  if (s === appBar.sent) return;
  appBar.sent = s;
  APP.bar(a[0], a[1], a[2], a[3], a[4]);
}

/* ================= Zustand, Vorladen und Ueberblenden ================= */
var DEFAULT_PAL = { low: "#7A7A7A", mid: "#BDBDBD", high: "#F2F2F2", t1: "#F4F4F4", t2: "#CFCFCF", t3: "#9C9C9C", lum: 0 };
var slides = document.getElementsByClassName("slide"), cur = -1, shownKey = null, wantKey = null;
var arts = {}, artOrder = [];   // Cover-Schluessel -> {img, pal}; geladene Bilder werden wiederverwendet
var artFail = {}, failKey = null;   // Cover-Schluessel -> Zeit des letzten Fehlschlags; Titel, der ohne Cover gezeigt wird
function paletteOf(img) { var saved = pal; extractPalette(img); var r = pal; pal = saved; return r; }
function loadArt(art, cb) {
  if (!art) { if (cb) cb(null); return; }
  var e = arts[art];
  if (e && e.ready) { if (cb) cb(e); return; }
  if (e) { if (cb) e.cbs.push(cb); return; }
  // nach einem Fehlschlag erst nach 10 s erneut versuchen
  if (artFail[art] && new Date().getTime() - artFail[art] < 10000) { if (cb) cb(null); return; }
  delete artFail[art];
  e = arts[art] = { ready: false, cbs: cb ? [cb] : [] };
  artOrder.push(art);
  while (artOrder.length > 6) delete arts[artOrder.shift()];
  var img = new Image();
  img.onload = function () {
    e.img = img; e.pal = paletteOf(img); e.ready = true;
    var c = e.cbs; e.cbs = [];
    for (var i = 0; i < c.length; i++) c[i](e);
  };
  img.onerror = function () {
    artFail[art] = new Date().getTime();
    if (arts[art] === e) { delete arts[art]; var k = artOrder.indexOf(art); if (k >= 0) artOrder.splice(k, 1); }
    var c = e.cbs; e.cbs = [];
    for (var i = 0; i < c.length; i++) c[i](null);
  };
  img.src = "art/" + art;
}
function drawCrop(canvas, img, w, h) {   // Bild mittig zuschneiden und fuellend zeichnen
  canvas.width = w; canvas.height = h;
  var g = canvas.getContext("2d");
  if (!img) { g.clearRect(0, 0, w, h); return; }
  var s = Math.max(w / img.width, h / img.height), iw = w / s, ih = h / s;
  g.drawImage(img, (img.width - iw) / 2, (img.height - ih) / 2, iw, ih, 0, 0, w, h);
}
function q(slide, cls) { return slide.getElementsByClassName(cls)[0]; }
// Lange Woerter ohne Leerzeichen ("KAU;blu/quartet") duerfen hinter Trennzeichen umbrechen
function soft(t) {
  return (t || "").replace(/\S{13,}/g, function (w) { return w.replace(/([\/;:_.|-])/g, "$1\u200B"); });
}
function showSlide(d, e) {
  var next = cur < 0 ? 0 : 1 - cur, s = slides[next], p = e ? e.pal : DEFAULT_PAL;
  var cov = q(s, "cover"), dpr = window.devicePixelRatio || 1;
  var size = Math.round((cov.clientWidth || window.innerHeight * .74) * dpr);
  drawCrop(cov, e && e.img, size, size);
  drawCrop(q(s, "bg"), e && e.img, 64, 40);
  // helle Cover ergeben einen hellen Hintergrund: dann staerker abdunkeln, damit der Text lesbar bleibt
  var f = "blur(40px) brightness(" + (p.lum > .5 ? .28 : p.lum > .3 ? .38 : .5) + ")", bg = q(s, "bg");
  bg.style.webkitFilter = f; bg.style.filter = f;
  var t = [["artist", d.artist, p.t1], ["title", d.title, p.t2],
           ["meta", [d.album, d.year].filter(function (v) { return v; }).join(" · "), p.t3]];
  for (var i = 0; i < t.length; i++) { var x = q(s, t[i][0]); x.textContent = soft(t[i][1]); x.style.color = t[i][2]; }
  pal = p;   // Leiste nimmt die Farben des neuen Covers
  syncAppBar();
  s.className = "slide";            // sichtbar machen (noch transparent) ...
  s.offsetWidth;                    // ... Layout erzwingen, damit die Ueberblendung startet
  s.className = "slide on";
  if (cur >= 0) {
    var old = slides[cur];
    old.className = "slide";
    setTimeout(function () { if (old.className === "slide") old.className = "slide gone"; }, 1700);
  }
  cur = next;
}
function render(d) {
  var view = d.source === "idle" ? "off" : "play";
  var cls = view;
  if (view === "play" && !d.playing) cls += " paused";
  if (view === "play" && d.skip) cls += " canskip";
  if (view === "play" && d.stop) cls += " canstop";
  if (view === "play" && d.similar) cls += " cansimilar";
  if (APP) {
    // Tablet-App: sie holt die Daten und zeichnet die Leiste, hier bleibt die eigene aus
    appBar.on = view === "play" && !!d.spectrum; appBar.url = d.spectrum || "";
    syncAppBar();
    if (view === "play") cls += " nospec";
    document.body.className = cls;
  } else {
    connectSpectrum(d.spectrum || "");
    // Leiste nur zeigen, wenn der Pi gerade wirklich Signal liefert (Musik direkt am WiiM: keins)
    var spec = view === "play" && d.spectrum && new Date().getTime() - lastSignal <= 4000;
    if (view === "play" && !spec) cls += " nospec";
    document.body.className = cls;
    // Zeichnen nur, solange die Leiste sichtbar ist (spart Rechenzeit auf dem alten Tablet)
    setRunning(spec);
  }
  if (view !== "play") return;
  var key = [d.art, d.artist, d.title, d.album, d.year].join("|");
  if (key !== shownKey && key !== wantKey) {
    wantKey = key;
    loadArt(d.art || "", function (e) {
      if (wantKey !== key) return;   // inzwischen schon der naechste Titel
      wantKey = null;
      if (!e && d.art) {
        // Cover gerade nicht ladbar: Text einmal ohne Cover zeigen, shownKey offen lassen,
        // damit die naechsten Abfragen es erneut versuchen
        if (failKey !== key) { failKey = key; shownKey = null; showSlide(d, null); }
        return;
      }
      failKey = null; showSlide(d, e); shownKey = key;
    });
  }
  // naechsten Titel (Plexamp) schon vorladen, damit der Wechsel ohne Wartezeit ueberblendet
  if (d.next && d.next.art) loadArt(d.next.art, null);
}
function poll() { get("api/now", render); }

/* Mehr davon, Stopp und naechster Titel: der Server reicht den Befehl an die spielende Quelle weiter */
function control(id) {
  var btn = el(id), busy = false;
  btn.onclick = function () {
    if (busy) return;
    busy = true; btn.className = "ctl busy";
    var x = new XMLHttpRequest();
    x.open("POST", "api/" + id, true);
    x.setRequestHeader("X-NowPlaying", "1");
    x.timeout = 6000;
    x.onloadend = function () {
      busy = false; poll();
      // "Mehr davon" aendert nichts Sichtbares: Erfolg kurz am Knopf zeigen
      if (id === "similar" && x.status === 204) {
        btn.className = "ctl done";
        setTimeout(function () { btn.className = "ctl"; }, 1500);
      } else btn.className = "ctl";
    };
    x.send();
  };
}
control("skip"); control("stop"); control("similar");

poll();
setInterval(poll, 1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Now Playing</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #F2F2F2; overflow: hidden;
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none; }
  .view { display: none; position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  body.play  #play  { display: block; }
  body.off   #off   { display: block; }

  /* ---------- Cover links, Songinfos rechts, LED-Leiste unten ----------
     Zwei Ebenen (.slide): die neue wird vorbereitet und blendet ueber die alte. */
  #play { background: #0B0B0C; overflow: hidden; }
  .slide { position: absolute; left: 0; top: 0; right: 0; bottom: 0; opacity: 0;
    -webkit-transition: opacity 1.5s ease; transition: opacity 1.5s ease; }
  .slide.on { opacity: 1; }
  .slide.gone { visibility: hidden; }
  .bg { position: absolute; left: -10%; top: -10%; width: 120%; height: 120%;
    -webkit-filter: blur(40px) brightness(.5); filter: blur(40px) brightness(.5);
    -webkit-transform: translateZ(0); transform: translateZ(0); }
  .stage { position: relative; height: 100%; box-sizing: border-box; padding: 5vh 5vw 4.5vh;
    display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .top { -webkit-flex: 1; flex: 1; min-height: 0;
    display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .cover { width: 74vh; height: 74vh; -webkit-flex: none; flex: none; border-radius: 1.2vh;
    box-shadow: 0 0 0 1px rgba(255,255,255,.09), 0 3vh 8vh rgba(0,0,0,.6); background: #1a1a1a;
    -webkit-transition: opacity .6s; transition: opacity .6s; }
  .info { -webkit-flex: 1; flex: 1; min-width: 0; margin-left: 8vw; margin-right: 2vw;
    text-shadow: 0 .3vh 1.5vh rgba(0,0,0,.45); -webkit-transition: opacity .6s; transition: opacity .6s; }
  .info div { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical;
    word-wrap: break-word; overflow-wrap: break-word; }  /* lange Woerter umbrechen statt abschneiden */
  .artist { font-size: 7vh; font-weight: 500; line-height: 1.15; color: #F4F4F4; -webkit-line-clamp: 2; }
  .title  { font-size: 4.6vh; line-height: 1.25; color: #D6D6D6; margin-top: 2vh; -webkit-line-clamp: 3; }
  .next   { font-size: 2.6vh; line-height: 1.3; margin-top: 3vh; -webkit-line-clamp: 1; opacity: .7; }
  .info .next:empty { display: none; }
  /* Passt der Textblock nicht zwischen die Knoepfe oben und unten, wird stufenweise gekuerzt
     (siehe fit): Titel zweizeilig, dann "Danach" weg, dann Titel einzeilig */
  .info.t1 .title { -webkit-line-clamp: 2; }
  .info.t2 .next { display: none; }
  .info.t3 .title { -webkit-line-clamp: 1; }
  /* Playlist, aus der der Titel kommt, mit kleinem Logo der Quelle */
  .info .pls { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
    font-size: 2.8vh; line-height: 1.3; margin-top: 1.4vh; white-space: nowrap; }
  .pls i { -webkit-flex: none; flex: none; width: 2.8vh; height: 2.8vh; margin-right: 1.2vh; }
  .pls i svg { display: block; width: 100%; height: 100%; }
  .pls span { overflow: hidden; text-overflow: ellipsis; }
  .meta   { font-size: 3.2vh; line-height: 1.3; color: #9C9C9C; margin-top: 1.6vh; -webkit-line-clamp: 2; }
  .specspace { height: 12vh; margin-top: 3.5vh; -webkit-flex: none; flex: none; }
  #spec { position: absolute; left: 5vw; right: 5vw; bottom: 4.5vh; width: 90vw; height: 12vh; display: block;
    -webkit-transform: translateZ(0); transform: translateZ(0); }  /* eigene Ebene ueber den Slides */
  body.paused .cover, body.paused .info { opacity: .5; }
  body.nospec #spec { visibility: hidden; }
  /* Mehr davon, Stopp und naechster Titel: rechts ueber der Leiste, nur wenn die Quelle das kann */
  .ctl { display: none; position: absolute; bottom: 22vh; width: 9vh; height: 9vh; border-radius: 50%;
    box-sizing: border-box; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07);
    color: rgba(255,255,255,.6); -webkit-transform: translateZ(0); transform: translateZ(0);
    -webkit-transition: opacity .2s; transition: opacity .2s; -webkit-tap-highlight-color: transparent; }
  .ctl svg { position: absolute; left: 27%; top: 27%; width: 46%; height: 46%; fill: currentColor; }
  .ctl.busy { opacity: .35; }
  /* untere Reihe: beginnt buendig mit dem Text (linke Kante der Infos); ausgeblendete Knoepfe
     hinterlassen keine Luecke */
  #ctls { position: absolute; left: calc(13vw + 74vh); bottom: 22vh; height: 9vh; white-space: nowrap;
    -webkit-transform: translateZ(0); transform: translateZ(0); }
  #ctls .ctl { position: relative; bottom: auto; float: left; margin-right: 2.5vh; }
  #ctls #skip { margin-right: 0; }
  body.canskip #skip, body.canprev #prev, body.canstop #stop, body.cansimilar #similar,
  body.canalbum #albumplay { display: block; }
  /* pausiert: die uebrigen Knoepfe bleiben stehen, ausgegraut und ohne Wirkung */
  body.paused #albumplay, body.paused #similar, body.paused #prev, body.paused #skip { opacity: .3; }
  body.inalbum #albumplay { opacity: .3; }
  body.nosimilar #similar { opacity: .3; }   /* fuer diesen Titel kennt Plex keine aehnlichen */
  /* Playlists: Knopf oben rechts klappt die zuletzt gespielten der laufenden Quelle auf */
  /* obere Reihe (Umschalter, Playlists): rechtsbuendig, die rechte Kante schliesst mit dem
     Vorwaerts-Knopf der unteren Reihe ab (fuenf Knoepfe zu 9vh mit 2.5vh Abstand = 55vh) */
  #tops { position: absolute; left: auto; right: 5vw; width: 55vh; top: 5vh; height: 9vh; white-space: nowrap;
    -webkit-transform: translateZ(0); transform: translateZ(0); }
  #tops .ctl { position: relative; bottom: auto; float: right; margin-left: 2.5vh; }
  body.canlist #plbtn { display: block; }
  /* Umschalter Plex <-> Spotify: laenglicher Knopf links neben dem Playlist-Knopf. Beide Logos
     stehen fest nebeneinander (Plex links, Spotify rechts); farbig ist die Quelle, die gerade
     laeuft, die andere ist grau. Antippen wechselt zur anderen. */
  #swbtn { width: 17vh; border-radius: 4.5vh; }
  /* Zufallswiedergabe: Schalter oben im Auswahlfeld, ueber beide Spalten */
  .plhead { -webkit-column-span: all; column-span: all; display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center; padding: .4vh 1.4vh 1vh; margin-bottom: .6vh;
    border-bottom: 1px solid rgba(255,255,255,.12); font-size: 3.1vh; color: #E4E4E4;
    -webkit-tap-highlight-color: transparent; }
  .plhead svg { width: 4vh; height: 4vh; margin-right: 1.6vh; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; -webkit-flex: none; flex: none; }
  .plhead span { -webkit-flex: 1; flex: 1; }
  .plhead i { -webkit-flex: none; flex: none; width: 9vh; height: 5vh; border-radius: 2.5vh; background: #55575b;
    position: relative; }
  .plhead i:after { content: ""; position: absolute; left: .6vh; top: .6vh; width: 3.8vh; height: 3.8vh;
    border-radius: 50%; background: #d9d9d9; }
  .plhead.on i { background: #7fb08a; }
  .plhead.on i:after { left: 4.6vh; background: #fff; }
  .plhead.off { opacity: .4; }
  body.canswitch #swbtn { display: block; }
  #swbtn svg { top: 2.1vh; width: 4.8vh; height: 4.8vh; fill: rgba(255,255,255,.26); }
  #swbtn .plex { left: 3vh; }
  #swbtn .spotify { left: 9.2vh; }
  #swbtn.to-spotify .plex { fill: #E5A00D; }
  #swbtn.to-plex .spotify { fill: #1ED760; }
  /* bis zu zehn Eintraege in zwei Spalten (links 1-5, rechts 6-10), ohne Blaettern */
  #plist { display: none; position: absolute; left: 5vw; right: 5vw; top: 16vh; box-sizing: border-box;
    padding: 1vh; border-radius: 1.6vh; background: #2e2f31; border: 1px solid rgba(255,255,255,.14);
    -webkit-column-count: 2; column-count: 2; -webkit-column-gap: 2vh; column-gap: 2vh;
    -webkit-transform: translateZ(0); transform: translateZ(0); }
  body.canlist #plist.open { display: block; }
  .pl { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
    padding: .55vh 0 .55vh 1.4vh; border-radius: 1vh; font-size: 3.1vh; color: #E4E4E4; -webkit-tap-highlight-color: transparent;
    -webkit-column-break-inside: avoid; break-inside: avoid; }
  .pl.busy { background: rgba(255,255,255,.14); }
  .pl img { width: 6.8vh; height: 6.8vh; -webkit-flex: none; flex: none; border-radius: .8vh; background: #2a2a2a; }
  .pl span { -webkit-flex: 1; flex: 1; min-width: 0; margin: 0 1.6vh; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .pl small { font-size: 2.5vh; color: #8F8F8F; }
  /* Stern: Favorit setzen oder entfernen, ohne die Playlist zu starten */
  .pl b { -webkit-flex: none; flex: none; width: 8.4vh; height: 6.8vh; position: relative; }
  .pl b svg { position: absolute; left: 26%; top: 24%; width: 48%; height: 52%; fill: none; stroke: #7d7d7d; stroke-width: 1.8; }
  .pl b.on svg { fill: #F2C94C; stroke: #F2C94C; }
  #plist p { margin: 2vh; font-size: 3vh; color: #9C9C9C; }
  /* Fortschritt: duenne Linie direkt ueber der Leiste, nur wenn die Quelle Spielzeit meldet */
  #prog { display: none; position: absolute; left: 5vw; width: 90vw; bottom: 17.6vh; height: .4vh;
    background: rgba(255,255,255,.10); border-radius: .2vh; overflow: hidden;
    -webkit-transform: translateZ(0); transform: translateZ(0); }
  /* bewusst ohne Animation: eine gleitende Linie laesst das alte Tablet die ganze Seite
     dauernd neu zeichnen (ein Prozessorkern), und die LED-Leiste ruckelt dann */
  #prog i { display: block; height: 100%; width: 0; background: rgba(255,255,255,.55); }
  body.hasprog #prog { display: block; }
  body.paused #prog { opacity: .5; }
  /* ---------- Grosse Ansicht ohne Leiste (Musik direkt am WiiM, oder mit dem
     Ansicht-Knopf gewaehlt): grosses Cover; die Knoepfe stehen unten rechts, die obere
     Reihe oben rechts, jeweils buendig mit dem Cover ---------- */
  body.big .specspace { display: none; }
  body.big .cover { width: 86vh; height: 86vh; }
  body.big .info { margin-left: 5vw; margin-right: 0; }
  body.big #ctls { left: auto; right: 5vw; bottom: 6.75vh; }
  body.big #prog { bottom: 2.6vh; }
  /* Ansicht-Schalter: dreiteilig, immer an derselben Stelle ganz oben rechts. Jedes Feld zeigt
     seine Ansicht als kleines Bild (Cover, Textzeilen, Leiste); das Feld der laufenden Ansicht ist
     hell. Antippen waehlt die Ansicht direkt. Die uebrige obere Reihe steht links daneben. */
  #views { display: none; position: absolute; right: 5vw; top: 5vh; width: 25.5vh; height: 9vh;
    box-sizing: border-box; border-radius: 4.5vh; overflow: hidden;
    border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07);
    -webkit-transform: translateZ(0); transform: translateZ(0); -webkit-tap-highlight-color: transparent; }
  body.canbar #views { display: block; }
  body.canbar #tops { right: calc(5vw + 28vh); }
  #views div { float: left; width: 33.33%; height: 100%; position: relative; color: rgba(255,255,255,.32); }
  #views svg { position: absolute; left: 50%; top: 50%; width: 5.4vh; height: 5.4vh; margin: -2.7vh 0 0 -2.7vh;
    fill: currentColor; }
  #views.v-full .vf, #views.v-big .vb, #views.v-cover .vc { color: #fff; background: rgba(255,255,255,.17); }
  /* ---------- Nur das Cover: mittig und so gross wie moeglich; von den Knoepfen bleibt
     nur der Ansicht-Schalter (dezent), damit man zurueckkommt ---------- */
  body.coveronly .info, body.coveronly #ctls, body.coveronly #swbtn, body.coveronly #plbtn { display: none; }
  body.coveronly #prog, body.coveronly #plist { display: none !important; }
  body.coveronly .top { -webkit-justify-content: center; justify-content: center; }
  body.coveronly .cover { width: 90vh; height: 90vh; }
  body.coveronly #views { opacity: .55; }
  #stop .play, body.paused #stop .stop { display: none; }   /* pausiert: Stopp wird zu Play */
  body.paused #stop .play { display: block; }
  .ctl.done { color: #fff; background: rgba(255,255,255,.22); }   /* kurz hell: eingefuegt */

  /* ---------- Keine Musik: schwarz, das Display geht aus ---------- */
  #off { background: #000; }
</style>
</head>
<body class="off">

<div id="play" class="view">
  <div class="slide gone"><canvas class="bg"></canvas><div class="stage"><div class="top">
    <canvas class="cover"></canvas>
    <div class="info"><div class="artist"></div><div class="title"></div><div class="meta"></div><div class="pls"><i></i><span></span></div><div class="next"></div></div>
  </div><div class="specspace"></div></div></div>
  <div class="slide gone"><canvas class="bg"></canvas><div class="stage"><div class="top">
    <canvas class="cover"></canvas>
    <div class="info"><div class="artist"></div><div class="title"></div><div class="meta"></div><div class="pls"><i></i><span></span></div><div class="next"></div></div>
  </div><div class="specspace"></div></div></div>
  <canvas id="spec"></canvas>

  <div id="ctls">
    <div id="albumplay" class="ctl"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 9.5a2.5 2.5 0 1 1 0 5a2.5 2.5 0 0 1 0-5z"/></svg></div>
    <div id="similar" class="ctl"><svg viewBox="0 0 24 24"><path d="M10 3l1.8 5.2 5.2 1.8-5.2 1.8L10 17l-1.8-5.2L3 10l5.2-1.8zM18 14l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></svg></div>
    <div id="prev" class="ctl"><svg viewBox="0 0 24 24"><path d="M19 5v14L8 12zM4.4 5H7v14H4.4z"/></svg></div>

    <div id="skip" class="ctl"><svg viewBox="0 0 24 24"><path d="M5 5v14l11-7zM17 5h2.6v14H17z"/></svg></div>
  </div>
  <div id="tops">
    <div id="plbtn" class="ctl"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zM3 11h12v2H3zM3 16h8v2H3zM16 12v9l6-4.5z"/></svg></div>
    <div id="swbtn" class="ctl"><svg class="spotify" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><path d="M6.2 9.1c3.9-1.1 8.6-.7 12 1.3M6.9 12.6c3.2-.9 7-.5 9.8 1.2M7.6 15.8c2.5-.6 5.3-.3 7.5 1" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></svg><svg class="plex" viewBox="0 0 24 24"><path d="M5.5 2h6.2l6.8 10-6.8 10H5.5l6.8-10z"/></svg></div>
  </div>
  <div id="views">

    <div class="vb" data-view="big"><svg viewBox="0 0 24 24"><path d="M3 5h13v14H3zM18 8h4v2h-4zM18 12h3v2h-3z"/></svg></div>

  </div>
  <div id="plist"></div>
</div>

<div id="off" class="view"></div>

<script>
// Bewusst ES5 + XMLHttpRequest, damit es auch im alten Android-WebView (Yoga: Android 6) laeuft.
function el(id) { return document.getElementById(id); }
function get(url, cb, timeout) {
  var x = new XMLHttpRequest();
  x.open("GET", url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + new Date().getTime(), true);
  x.timeout = timeout || 6000;
  x.onload = function () { try { cb(JSON.parse(x.responseText)); } catch (e) {} };
  x.send();
}

/* ================= Cover-Farben ================= */
var pal = { low: "#3E8C9C", mid: "#E9A24F", high: "#F2E6D0" };
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), h = 0, s = 0, l = (mx + mn) / 2, d = mx - mn;
  if (d) {
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hsl(h, s, l) { return "hsl(" + Math.round(h) + "," + Math.round(s * 100) + "%," + Math.round(l * 100) + "%)"; }
function extractPalette(img) {
  try {
    var c = document.createElement("canvas"); c.width = c.height = 32;
    var x = c.getContext("2d"); x.drawImage(img, 0, 0, 32, 32);
    var d = x.getImageData(0, 0, 32, 32).data, bins = [], i, k, bright = [0, 0, 0], lum = 0;
    for (k = 0; k < 12; k++) bins.push({ w: 0, h: 0, s: 0, l: 0 });
    for (i = 0; i < d.length; i += 4) {
      var p = rgb2hsl(d[i], d[i + 1], d[i + 2]);
      lum += p[2];
      if (p[2] > bright[2]) bright = p;
      if (p[1] < .15 || p[2] < .12 || p[2] > .92) continue;
      var w = p[1] * (1 - Math.abs(p[2] - .5));
      var b = bins[Math.floor(p[0] / 30) % 12];
      b.w += w; b.h += p[0] * w; b.s += p[1] * w; b.l += p[2] * w;
    }
    var order = bins.map(function (b, idx) { return { b: b, i: idx }; })
      .filter(function (o) { return o.b.w > 0; })
      .sort(function (a, b) { return b.b.w - a.b.w; });
    lum = lum / (d.length / 4);   // nicht in pal schreiben: das ist noch die Palette des gezeigten Covers
    if (!order.length) {
      pal = { low: "#7A7A7A", mid: "#BDBDBD", high: "#F2F2F2", t1: "#F4F4F4", t2: "#CFCFCF", t3: "#9C9C9C", lum: lum };
      return;
    }
    function col(o, lMin) {
      var b = o.b; return [b.h / b.w, Math.max(.35, b.s / b.w), Math.max(lMin, Math.min(.75, b.l / b.w))];
    }
    var m = col(order[0], .5), lo = m;
    for (k = 1; k < order.length; k++) {
      var dist = Math.abs(order[k].i - order[0].i); dist = Math.min(dist, 12 - dist);
      if (dist >= 2) { lo = col(order[k], .42); break; }
    }
    if (lo === m) lo = [m[0], m[1] * .8, .42];
    var hi = bright[2] > .7 ? [bright[0], Math.min(bright[1], .5), Math.max(.82, bright[2])] : [m[0], .35, .86];
    // Textfarben: Grundton des Covers, hell genug fuer den dunklen Hintergrund
    pal = { low: hsl(lo[0], lo[1], lo[2]), mid: hsl(m[0], m[1], m[2]), high: hsl(hi[0], hi[1], hi[2]),
            t1: hsl(m[0], Math.min(m[1], .45), .9),
            t2: hsl(m[0], Math.max(.45, Math.min(m[1], .8)), .72),
            t3: hsl(m[0], .18, .64), lum: lum };
  } catch (e) {}
}

/* ================= Spektrum (LED-Leiste) ================= */
var N = 40, M = 10, lv = [], pk = [], tg = [], lastSpec = 0, lastSignal = 0, es = null, esUrl = "";
for (var z = 0; z < N; z++) { lv.push(0); pk.push(0); tg.push(0); }
function onSpectrum(arr) {
  var sum = 0;
  for (var i = 0; i < N; i++) {
    tg[i] = Math.min(1, (parseInt(arr[Math.floor(i * arr.length / N)], 10) || 0) / 1000);
    sum += tg[i];
  }
  lastSpec = new Date().getTime();
  if (sum > .2) lastSignal = lastSpec;
}
function connectSpectrum(url) {
  if (url === esUrl) return;
  if (es) { es.close(); es = null; }
  esUrl = url;
  if (!url || !window.EventSource) return;
  es = new EventSource(url);
  es.onmessage = function (e) { onSpectrum(e.data.split(";")); };
}
/* Sparsam fuer das alte Tablet: 30 Bilder/s (FRAME_MS), Zeichnen in CSS-Pixeln,
   die dunklen Zellen werden einmal vorgezeichnet, und es wird nur neu gezeichnet,
   wenn sich mindestens eine Zelle aendert. */
var cv = el("spec"), cx = cv.getContext("2d"), running = false, SCALE = 1, FRAME_MS = 33;  // 30 Bilder/s = Takt der Daten vom Pi
var grid = document.createElement("canvas"), gridKey = "", shown = [], geo = null, lastFrame = 0;
var BANDS = [[0, 5, "low"], [5, 8, "mid"], [8, 10, "high"]];  // Zeilen [von, bis) -> Farbe
function cellY(r) { return geo.h - (r + 1) * geo.sh - r * geo.gy; }
function layout() {
  var w = Math.round(cv.clientWidth * SCALE), h = Math.round(cv.clientHeight * SCALE);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  var gx = w * .006, gy = h * .03;
  geo = { w: w, h: h, gx: gx, gy: gy, bw: (w - gx * (N - 1)) / N, sh: (h - gy * (M - 1)) / M };
  var key = w + "x" + h + pal.low + pal.mid + pal.high;
  if (key === gridKey) return false;

      post("api/playlist?id=" + encodeURIComponent(it.id), function () { closeList(); poll(); });
    };
    star.onclick = function (ev) {
      ev.stopPropagation();   // nur markieren, nicht starten
      var on = star.className !== "on";
      star.className = on ? "on" : "";
      keepOpen();
      post("api/favorite?id=" + encodeURIComponent(it.id) + "&on=" + (on ? 1 : 0), function (ok) {
        if (!ok) star.className = on ? "" : "on";   // nicht gespeichert: Anzeige zuruecknehmen
      });
    };
    plist.appendChild(row);
  })(items[i]);
}
/* Umschalter: haelt die laufende Quelle an und spielt die andere weiter */
el("swbtn").onclick = function () {
  var b = el("swbtn");
  if (b.className.indexOf("busy") >= 0) return;
  b.className = "ctl busy " + swTarget;
  post("api/switch", function () { b.className = "ctl " + swTarget; poll(); });
};
/* Ansicht-Schalter: Antippen eines Feldes waehlt dessen Ansicht; der Server merkt sie sich */
(function () {
  var fields = el("views").children;
  for (var i = 0; i < fields.length; i++) (function (f) {
    f.onclick = function () {
      var v = f.getAttribute("data-view");
      el("views").className = "v-" + v;   // sofort zeigen, die Abfrage bestaetigt es
      post("api/view?to=" + v, function () { poll(); });
    };
  })(fields[i]);
})();
el("plbtn").onclick = function () {
  if (plist.className === "open") { closeList(); return; }
  get("api/playlists", function (items) {
    fillList(items || []);
    plist.className = "open";
    keepOpen();
  }, 20000);   // die erste Spotify-Liste braucht einige Sekunden
};

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
